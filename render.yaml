services:
  - type: web
    name: lifeops-agent
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: GOOGLE_API_KEY
        sync: false        # set this in the Render dashboard, never in git
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
